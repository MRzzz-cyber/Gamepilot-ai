name: Deploy GamePilot to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests and build
        run: npm run check
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured: Cloudflare deployment cannot run"
            exit 1
          fi
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


      - name: Verify DNF account search and cross-game routing
        timeout-minutes: 3
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://gamepilot-ai.zqsanjingshou.workers.dev';
          const query='地下城勇士 1000 元的账号';
          const game='地下城与勇士';
          const smoke=await fetch(base+'/api/universal-smoke',{signal:AbortSignal.timeout(15000)}).then(r=>r.json());
          if(!smoke.passed||!smoke.checks.some(x=>x.game===game&&x.paged_marketplace==='三乐网')||
             !smoke.checks.some(x=>x.game==='DNF手游'&&x.paged_marketplace===null)){
            throw Error('Cross-game or DNF edition routing failed');
          }
          async function post(path,body){
            const response=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify(body),signal:AbortSignal.timeout(45000)});
            return {status:response.status,data:await response.json()};
          }
          const temporary=data=>data.trace?.some(x=>x.result?.status==='fetch_failed'||[500,502,503,504].includes(x.result?.http_status))&&
            !data.trace?.some(x=>[403,429].includes(x.result?.http_status));
          let first;
          for(let attempt=0;attempt<3;attempt++){
            first=await post('/api/chat',{message:query});
            if((first.data.items?.length||0)>=100||!temporary(first.data))break;
          }
          const initial=first.data.items||[];
          const cursor=first.data.listing_page;
          const trace=first.data.trace?.filter(x=>x.tool==='discover_sanlewang.com'||x.tool==='pzds_category');
          console.log('DNF_FIRST',JSON.stringify({status:first.status,game:first.data.requirements?.game,first:initial.length,
            sources:[...new Set(initial.map(x=>x.platform))],near:initial.filter(x=>x.price>=700).length,
            top:initial.slice(0,8).map(x=>x.price),source_pages:cursor?.source_pages,
            source_rows:trace?.find(x=>x.result?.source_rows)?.result.source_rows,trace}));
          if(first.status!==200||first.data.requirements?.game!==game||cursor?.source!=='三乐网'||
             cursor.sort!=='price_desc'||!cursor.next_page||initial.length<100||initial[0].price<900){
            throw Error('DNF first page did not return 100 priced desktop accounts in budget order');
          }
          const follow=await post('/api/search',{query,page:cursor.next_page,cursor:cursor.next_cursor});
          const more=follow.data.items||[];
          const all=[...initial,...more];
          const sorted=rows=>rows.every((x,i)=>i===0||rows[i-1].price>=x.price);
          const attributes=initial.filter(x=>x.server&&x.key_attributes?.profession).length;
          console.log('DNF_PRODUCTION',JSON.stringify({first:initial.length,additional:more.length,attributes,
            near:initial.filter(x=>x.price>=700).length,top:initial.slice(0,8).map(x=>x.price),
            first_brave:first.data.search_diagnostics?.brave?.requests,next_brave:follow.data.search_diagnostics?.brave?.requests,
            route_checks:smoke.checks.length,follow_status:follow.status}));
          if(follow.status!==200||!more.length||new Set(all.map(x=>x.id)).size!==all.length||
             !sorted(initial)||!sorted(more)||!attributes||
             all.some(x=>x.game!==game||!Number.isFinite(x.price)||x.price<=0||x.price>1000||!x.price_evidence)||
             first.data.search_diagnostics.brave.requests||follow.data.search_diagnostics.brave.requests){
            throw Error('DNF catalogue pagination, product evidence, or budget verification failed');
          }
          NODE

      - name: Verify the expanded 1000 yuan Delta search
        timeout-minutes: 3
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url='https://gamepilot-ai.zqsanjingshou.workers.dev/api/search';
          const query='三角洲1000元以内的账号';
          let data,items,near,withFacts;
          for(let attempt=0;attempt<3;attempt++){
            const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({query,disable_brave:true}),signal:AbortSignal.timeout(40000)});
            if(!response.ok)throw Error('1000 yuan search HTTP '+response.status);
            data=await response.json();
            items=data.items||[];
            near=items.filter(x=>x.price>=700);
            withFacts=near.filter(x=>Object.entries(x.delta_attributes||{}).some(([key,value])=>key!=='realname'&&value!=null));
            if(items.length>=120&&near.length>=20&&withFacts.length>=10)break;
            if(data.trace?.some(x=>[403,429].includes(x.result?.http_status)))break;
            if(attempt<2)await new Promise(resolve=>setTimeout(resolve,2200));
          }
          console.log('DELTA_1000_PRODUCTION',JSON.stringify({total:items.length,near:near.length,with_facts:withFacts.length,
            prices:items.slice(0,8).map(x=>x.price),sources:[...new Set(items.map(x=>x.platform))],
            sample:withFacts.slice(0,2).map(x=>({price:x.price,url:x.url,fields:x.delta_attributes})),
            source_errors:data.trace?.filter(t=>t.result?.http_status>=400).map(t=>[t.result.bucket,t.result.page,t.result.http_status])}));
          if(items.length<120||near.length<20||withFacts.length<10||new Set(items.map(x=>x.id)).size!==items.length||
             items.some((x,i)=>!Number.isFinite(x.price)||x.price<=0||x.price>1000||!x.price_evidence||(i>0&&items[i-1].price<x.price))){
            throw Error('1000 yuan coverage, listing evidence, or ranking did not pass');
          }
          NODE

      - name: Verify deployed Delta account search and pagination
        timeout-minutes: 2
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://gamepilot-ai.zqsanjingshou.workers.dev';
          const query='三角洲500元以内的账号';
          const temporary=data=>data.trace?.some(t=>[500,502,503,504].includes(t.result?.http_status)||t.result?.status==='fetch_failed')&&
            !data.trace?.some(t=>[403,429].includes(t.result?.http_status));
          async function post(path, body) {
            for(let attempt=0;attempt<3;attempt++){
              const response=await fetch(base+path, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify(body), signal:AbortSignal.timeout(35000)
              });
              const data=await response.json();
              if(response.ok)return data;
              if(response.status!==502||!temporary(data)||attempt===2){
                console.log('DELTA_REQUEST_FAILURE',JSON.stringify({path,status:response.status,trace:data.trace?.map(t=>t.result)}));
                throw Error(path+' HTTP '+response.status);
              }
              await new Promise(resolve=>setTimeout(resolve,2500));
            }
          }
          let first=await post('/api/chat',{message:query});
          for(let attempt=0;attempt<2&&(first.items?.length||0)<100&&temporary(first);attempt++){
            await new Promise(resolve=>setTimeout(resolve,2500));
            first=await post('/api/chat',{message:query});
          }
          const cursor=first.listing_page;
          console.log('DELTA_FIRST_ORDER',JSON.stringify({count:first.items?.length,prices:first.items?.slice(0,6).map(x=>x.price),sort:cursor?.sort}));
          if(!cursor?.next_page||(first.items?.length||0)<100){
            console.log('DELTA_SOURCE_FAILURE',JSON.stringify(first.trace?.filter(x=>x.tool.startsWith('discover_taoshouyou')||x.tool==='pzds_category')));
            throw Error('Delta catalogue did not return at least 100 priced listings and a continuation');
          }
          const second=await post('/api/search',{query,page:cursor.next_page,cursor:cursor.next_cursor});
          const shown=new Set(first.items.map(x=>x.id));
          const additional=second.items?.filter(x=>!shown.has(x.id)).length||0;
          const all=[...first.items,...(second.items||[])];
          console.log('DELTA_PRODUCTION',JSON.stringify({first:first.items.length,additional,source_pages:cursor.source_pages,
            paid_requests:(first.search_diagnostics.brave.requests||0)+(second.search_diagnostics.brave.requests||0),
            sample:all.slice(0,3).map(x=>({price:x.price,url:x.url}))}));
          const sorted=items=>items.every((x,i)=>i===0||items[i-1].price>=x.price);
          if(cursor.sort!=='price_desc'||first.items[0].price<400||!sorted(first.items)||!sorted(second.items||[])){
            throw Error('Delta recommendations are not ordered closest to the 500 yuan budget');
          }
          if(!additional||shown.size!==first.items.length||all.some(x=>!Number.isFinite(x.price)||x.price<=0||x.price>500||!x.price_evidence)||
             first.search_diagnostics.brave.requests||second.search_diagnostics.brave.requests){
            throw Error('Delta pagination, budget or source checks failed');
          }
          NODE

      - name: Verify deployed G买卖 prices and final search results
        timeout-minutes: 3
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://gamepilot-ai.zqsanjingshou.workers.dev';
          const response=await fetch(base+'/api/acceptance',{signal:AbortSignal.timeout(25000)});
          if(!response.ok)throw Error('acceptance_http_'+response.status);
          const acceptance=await response.json();
          console.log('PRODUCTION_ACCEPTANCE',JSON.stringify({passed:acceptance.passed,category_priced:acceptance.category_priced,unique_product_links:acceptance.unique_product_links,details:acceptance.detail_samples?.map(x=>({game:x.detail_game,price:x.price,status:x.status}))}));
          if(!acceptance.passed||acceptance.category_priced<1)throw Error('Live G买卖 category prices or game identity failed verification');
          const sr=await fetch(base+'/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'2000元以内冒险岛账号',filters:{},disable_brave:true}),signal:AbortSignal.timeout(95000)});
          if(!sr.ok)throw Error('search_http_'+sr.status);
          const data=await sr.json();
          const priced=(data.items||[]).filter(x=>x.platform==='G买卖'&&Number(x.price)>0);
          const target=priced.find(x=>String(x.url||'').includes('4860003785'));
          console.log('PRODUCTION_SEARCH',JSON.stringify({matched:priced.length,unpriced:data.unpriced_leads?.length||0,category_priced:data.coverage?.platforms?.find(x=>x.platform==='G买卖')?.with_price,target_price:target?.price??null,example:priced.slice(0,3).map(x=>({title:x.title,price:x.price}))}));
          if(priced.length<1)throw Error('Production search returned zero priced G买卖 listings');
          NODE
