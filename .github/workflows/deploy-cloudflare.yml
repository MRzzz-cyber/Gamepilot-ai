name: Deploy GamePilot to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests and build
        run: npm run check
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured: Cloudflare deployment cannot run"
            exit 1
          fi
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed Delta account search and pagination
        timeout-minutes: 2
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://gamepilot-ai.zqsanjingshou.workers.dev';
          const query='三角洲500元以内的账号';
          async function post(path, body) {
            const response=await fetch(base+path, {
              method:'POST', headers:{'Content-Type':'application/json'},
              body:JSON.stringify(body), signal:AbortSignal.timeout(35000)
            });
            if(!response.ok)throw Error(path+' HTTP '+response.status);
            return await response.json();
          }
          let first=await post('/api/chat',{message:query});
          if((first.items?.length||0)<100&&first.trace?.some(t=>[500,502,503,504].includes(t.result?.http_status))){
            await new Promise(resolve=>setTimeout(resolve,2500));
            first=await post('/api/chat',{message:query});
          }
          const cursor=first.listing_page;
          if(!cursor?.next_page||(first.items?.length||0)<100){
            console.log('DELTA_SOURCE_FAILURE',JSON.stringify(first.trace?.filter(x=>x.tool.startsWith('discover_taoshouyou')||x.tool==='pzds_category')));
            throw Error('Delta catalogue did not return at least 100 priced listings and a continuation');
          }
          const second=await post('/api/search',{query,page:cursor.next_page,cursor:cursor.next_cursor});
          const shown=new Set(first.items.map(x=>x.id));
          const additional=second.items?.filter(x=>!shown.has(x.id)).length||0;
          const all=[...first.items,...(second.items||[])];
          console.log('DELTA_PRODUCTION',JSON.stringify({first:first.items.length,additional,source_pages:cursor.source_pages,
            paid_requests:(first.search_diagnostics.brave.requests||0)+(second.search_diagnostics.brave.requests||0),
            sample:all.slice(0,3).map(x=>({price:x.price,url:x.url}))}));
          const sorted=items=>items.every((x,i)=>i===0||items[i-1].price>=x.price);
          if(cursor.sort!=='price_desc'||first.items[0].price<400||!sorted(first.items)||!sorted(second.items||[])){
            throw Error('Delta recommendations are not ordered closest to the 500 yuan budget');
          }
          if(!additional||shown.size!==first.items.length||all.some(x=>!Number.isFinite(x.price)||x.price<=0||x.price>500||!x.price_evidence)||
             first.search_diagnostics.brave.requests||second.search_diagnostics.brave.requests){
            throw Error('Delta pagination, budget or source checks failed');
          }
          NODE

      - name: Verify deployed G买卖 prices and final search results
        timeout-minutes: 3
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://gamepilot-ai.zqsanjingshou.workers.dev';
          const response=await fetch(base+'/api/acceptance',{signal:AbortSignal.timeout(25000)});
          if(!response.ok)throw Error('acceptance_http_'+response.status);
          const acceptance=await response.json();
          console.log('PRODUCTION_ACCEPTANCE',JSON.stringify({passed:acceptance.passed,category_priced:acceptance.category_priced,unique_product_links:acceptance.unique_product_links,details:acceptance.detail_samples?.map(x=>({game:x.detail_game,price:x.price,status:x.status}))}));
          if(!acceptance.passed||acceptance.category_priced<1)throw Error('Live G买卖 category prices or game identity failed verification');
          const sr=await fetch(base+'/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'2000元以内冒险岛账号',filters:{},disable_brave:true}),signal:AbortSignal.timeout(95000)});
          if(!sr.ok)throw Error('search_http_'+sr.status);
          const data=await sr.json();
          const priced=(data.items||[]).filter(x=>x.platform==='G买卖'&&Number(x.price)>0);
          const target=priced.find(x=>String(x.url||'').includes('4860003785'));
          console.log('PRODUCTION_SEARCH',JSON.stringify({matched:priced.length,unpriced:data.unpriced_leads?.length||0,category_priced:data.coverage?.platforms?.find(x=>x.platform==='G买卖')?.with_price,target_price:target?.price??null,example:priced.slice(0,3).map(x=>({title:x.title,price:x.price}))}));
          if(priced.length<1)throw Error('Production search returned zero priced G买卖 listings');
          NODE
