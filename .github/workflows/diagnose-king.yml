name: Diagnose live King of Glory search
on:
  pull_request:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce search and inspect public source pages
        run: |
          node --input-type=module <<'NODE'
          const base='https://gamepilot-ai.zqsanjingshou.workers.dev';
          const cases=[
            {name:'king_filters',query:'1000元以内的王者荣耀苹果QQ账号，支持二次实名，皮肤越多越好',filters:{game:'王者荣耀',server:'苹果QQ',max_price:1000,realname:'yes'}},
            {name:'king_basic',query:'1000元以内的王者荣耀账号',filters:{game:'王者荣耀',max_price:1000}},
          ];
          for(const test of cases){
           const time=Date.now();
           try {
            const response=await fetch(base+'/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(test),signal:AbortSignal.timeout(110000)});
            const data=await response.json();
            const traces=(data.trace||[]).map(t=>({tool:t.tool,query:t.query?.slice(0,110),result:t.result,duration:t.duration_ms})).filter(t=>t.tool.startsWith('discover_')||t.tool.includes('5173')||t.tool.includes('category')||t.tool==='search_configuration');
            console.log('LIVE_SEARCH '+JSON.stringify({name:test.name,status:response.status,ms:Date.now()-time,matched:data.items?.length||0,unpriced:data.unpriced_leads?.length||0,excluded:data.excluded_leads?.length||0,zero_reason:data.harness?.zero_result_reason,diagnostics:{upstream_errors:data.search_diagnostics?.upstream_errors,raw_hits:data.search_diagnostics?.raw_search_hits,product_urls:data.search_diagnostics?.product_urls},traces}));
           }catch(e){console.log('LIVE_SEARCH_ERROR '+test.name+' '+String(e?.message||e))}
          }
          for(const [name,url] of [
           ['pzds-home','https://www.pzds.com/'],
           ['pzds-product','https://www.pzds.com/goodsDetails/C8YDZP/6'],
           ['pzds-product-2','https://www.pzds.com/goodsDetails/C8UCZH/6'],
           ['pzds-game','https://www.pzds.com/goodsList/6'],
           ['5173-shop','https://shop.5173.com/'],
           ['gmmsj-home','https://www.gmmsj.com/']
          ]){
           try{
            const start=Date.now();
            const r=await fetch(url,{headers:{'Accept':'text/html','User-Agent':'Mozilla/5.0'},signal:AbortSignal.timeout(12000)});
            const h=(await r.text()).slice(0,500000);
            const links=[...h.matchAll(/(?:href|data-href|data-url)=["']([^"']+(?:goodsDetails|detail_)[^"']*)["']/gi)].slice(0,5).map(x=>x[1].slice(0,150));
            console.log('SOURCE_PROBE '+JSON.stringify({name,status:r.status,ms:Date.now()-start,length:h.length,title:h.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.slice(0,140),links,mentionsKing:h.includes('王者荣耀'),mentionsApple:h.includes('苹果QQ'),prices:[...h.matchAll(/(?:[¥￥]|price["']?\s*[:：])\s*[1-9]\d*/g)].length,starts:h.slice(0,160).replace(/\s+/g,' ')}));
           }catch(e){console.log('SOURCE_ERROR '+name+' '+String(e?.message||e))}
          }
          NODE

      - name: Inspect 盼之 first-party game categories and price markup
        run: |
          node --input-type=module <<'NODE'
          const domains=['https://www.pzds.com/','https://www.pzds.com/goodsList/1','https://www.pzds.com/goodsList/2','https://www.pzds.com/goodsList/3','https://www.pzds.com/goodsList/4','https://www.pzds.com/goodsList/6','https://www.pzds.com/goodsDetails/C8YDZP/6'];
          const ctxt=(s,index,size=240)=>index<0?'':s.slice(Math.max(0,index-size),index+size).replace(/\s+/g,' ').slice(0,700);
          for(const url of domains){
            try{
              const response=await fetch(url,{headers:{Accept:'text/html','User-Agent':'Mozilla/5.0'},signal:AbortSignal.timeout(12000)});
              const h=(await response.text()).slice(0,900000);
              const links=[...h.matchAll(/href=["']([^"']*goodsList[^"']*)["']/gi)].slice(0,10).map(m=>m[1].slice(0,100));
              const productLinks=[...h.matchAll(/href=["']([^"']*goodsDetails[^"']*)["']/gi)].slice(0,6).map(m=>m[1].slice(0,110));
              const source=h.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.slice(0,100);
              const priceContexts=[...h.matchAll(/(?:price|sellingPrice|goodsPrice|salePrice|565)[^<\n]{0,30}/gi)].slice(0,10).map(m=>ctxt(h,m.index,90));
              const kingContexts=[...h.matchAll(/王者荣耀/g)].slice(0,5).map(m=>ctxt(h,m.index,180));
              console.log('CATEGORY_PROBE '+JSON.stringify({url,status:response.status,bytes:h.length,title:source,links,productLinks,kingContexts:kingContexts.slice(0,3),priceContexts:priceContexts.slice(0,6)}));
            }catch(e){console.log('CATEGORY_ERROR '+url+' '+String(e?.message||e))}
          }
          NODE


      - name: Inspect official 王者荣耀 page and detail extraction
        run: |
          node --input-type=module <<'NODE'
          const {readFileSync}=await import('node:fs');
          const src=readFileSync('worker/index.js','utf8');
          const lib=new Function('fetch','URL','Response','AbortSignal',src.replace('export default {','const worker = {')+';return {verifyListing,extractDetailPrice,visibleDetailPrice,extractListingAttributes}')(fetch,URL,Response,AbortSignal);
          const url='https://www.pzds.com/goodsList/7/6';
          const res=await fetch(url,{headers:{'Accept':'text/html','User-Agent':'Mozilla/5.0'},signal:AbortSignal.timeout(12000)});
          const html=(await res.text()).slice(0,1000000);
          const tags=[...html.matchAll(/href=["']([^"']*\/goodsDetails\/[A-Za-z0-9]+\/6[^"']*)["']/g)];
          const first=tags.slice(0,4).map(m=>({url:m[1],before:html.slice(Math.max(0,m.index-320),m.index).replace(/\s+/g,' ').slice(0,400),after:html.slice(m.index,m.index+1000).replace(/\s+/g,' ').slice(0,1000)}));
          console.log('KING_LIST '+JSON.stringify({status:res.status,bytes:html.length,title:html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1],links:tags.length,first,priceText:html.match(/<span[^>]*class="[^"]*price-text[^"]*"[^>]*>[\s\S]{0,100}<\/span>/i)?.[0]}));
          for(const id of ['C8YDZP','C8UCZH']){
            const u='https://www.pzds.com/goodsDetails/'+id+'/6';
            const x=await lib.verifyListing(u);
            console.log('KING_DETAIL '+JSON.stringify({id,status:x.status,game:x.detail_game,price:x.price,price_evidence:x.price_evidence,title:x.page_title,attributes:x.detail_attributes,fetch_error:x.fetch_error,http_status:x.http_status}));
          }
          NODE


      - name: Inspect pzds official listing card price and identity fields
        run: |
          node --input-type=module <<'NODE'
          const res=await fetch('https://www.pzds.com/goodsList/7/6',{headers:{Accept:'text/html','User-Agent':'Mozilla/5.0'},signal:AbortSignal.timeout(12000)});
          const h=await res.text();
          const cards=[...h.matchAll(/<a\b[^>]*href=["'](\/goodsDetails\/[A-Za-z0-9]+\/6[^"']*)["'][^>]*>/g)].slice(0,11);
          console.log('LIST_COUNT '+cards.length);
          for(const x of cards){
            const end=h.indexOf('</a>',x.index);
            const item=h.slice(x.index,end>0?end+4:x.index+6000);
            const plain=item.replace(/<[^>]+>/g,' ').replace(/&[^;\s]+;/g,' ').replace(/\s+/g,' ').slice(0,650);
            const prices=[...item.matchAll(/<(?:span|div|p)\b[^>]*class=["'][^"']*(?:price|money|currency)[^"']*["'][^>]*>[\s\S]{0,180}?(?:<\/(?:span|div|p)>)/gi)].slice(0,12).map(m=>m[0].replace(/\s+/g,' ').slice(0,220));
            console.log('ITEM '+JSON.stringify({url:x[1],bytes:item.length,plain,priceTags:prices,title:x[0].match(/title=["']([^"']*)["']/)?.[1]?.slice(0,120),server:plain.match(/苹果QQ|苹果微信|安卓QQ|安卓微信/)?.[0],realname:plain.match(/可二次实名|不可二次实名/)?.[0]}));
          }
          NODE


      - name: Identify pzds category pagination and inexpensive products
        run: |
          node --input-type=module <<'NODE'
          const variants=[
            'https://www.pzds.com/goodsList/7/6',
            'https://www.pzds.com/goodsList/7/6?page=2',
            'https://www.pzds.com/goodsList/7/6?pageNum=2',
            'https://www.pzds.com/goodsList/7/6?currentPage=2',
            'https://www.pzds.com/goodsList/7/6?sortType=1',
            'https://www.pzds.com/goodsList/7/6?minPrice=0&maxPrice=1000',
          ];
          for(const url of variants){
           try{
            const resp=await fetch(url,{headers:{Accept:'text/html','User-Agent':'Mozilla/5.0'},signal:AbortSignal.timeout(13000)});
            const html=(await resp.text()).slice(0,850000);
            const cards=[...html.matchAll(/<a\b[^>]*href=["']\/goodsDetails\/([A-Za-z0-9]+)\/6[^"']*["'][^>]*>/g)];
            const products=[];
            for(const m of cards.slice(0,14)){
              const end=html.indexOf('</a>',m.index);
              const plain=html.slice(m.index,end).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,750);
              products.push({id:m[1],price:plain.match(/[¥￥]\s*(\d+(?:\.\d{2})?)/)?.[1]||null,server:plain.match(/苹果QQ|苹果微信|安卓QQ|安卓微信/)?.[0],realname:/不可二次实名/.test(plain)?'no':/可二次实名/.test(plain)?'yes':null});
            }
            console.log('PAGE_PROBE '+JSON.stringify({url,status:resp.status,ids:products.map(x=>x.id),products,hasPagination:html.includes('pagination'),htmlLen:html.length}));
           }catch(e){console.log('PAGE_ERROR '+url+' '+String(e?.message||e))}
          }
          NODE


      - name: Real pzds HTML through modified full search (Brave outage simulated)
        run: |
          node --input-type=module <<'NODE'
          const {readFileSync}=await import('node:fs');
          const src=readFileSync('worker/index.js','utf8');
          const actualFetch=fetch;
          const mockedFetch=async (input,opts)=>{
            const url=new URL(String(input));
            if(url.hostname==='api.search.brave.com')return new Response(JSON.stringify({error:{detail:'Prepaid credit balance is insufficient'}}),{status:402,headers:{'Content-Type':'application/json'}});
            return actualFetch(input,opts);
          };
          const api=new Function('fetch','URL','Response','AbortSignal',src.replace('export default {','const worker = {')+';return {worker,pzdsCategoryLeads}')(
            mockedFetch,URL,Response,AbortSignal);
          const feed=await api.pzdsCategoryLeads({name:'王者荣耀'},{});
          console.log('OFFICIAL_FEED '+JSON.stringify({pages:feed.pages,priced:feed.priced,found:feed.items.length,first:feed.items.slice(0,4).map(x=>({title:x.title,price:x.price,server:x.server,realname:x.realname})),under_1000_apple_qq:feed.items.filter(x=>x.price<=1000&&x.server==='苹果QQ'&&x.realname===true).map(x=>({id:x.id,price:x.price}))}));
          const response=await api.worker.fetch({url:'https://gamepilot.example/api/search',method:'POST',
            json:async()=>({query:'1000元以内的王者荣耀苹果QQ账号，支持二次实名，皮肤越多越好',filters:{game:'王者荣耀',max_price:1000,server:'苹果QQ',realname:'yes'}})},{BRAVE_SEARCH_API_KEY:'credit_insufficient'});
          const data=await response.json();
          console.log('REAL_FULL_SEARCH '+JSON.stringify({status:response.status,matched:data.candidates?.length||0,unpriced:data.unpriced_leads?.length||0,excluded:data.excluded_leads?.length||0,zero_reason:data.harness?.zero_result_reason,source:data.trace?.find(x=>x.tool==='pzds_category')?.result,matched_prices:data.candidates?.slice(0,8).map(x=>({price:x.price,server:x.server,realname:x.realname,source:x.platform,title:x.title.slice(0,100)}))}));
          if(feed.priced===0)throw Error('PZDS source prices were all missing');
          if(!data.candidates?.length)throw Error('Strict 王者荣耀 search still returned no priced cards despite official source matches');
          NODE
